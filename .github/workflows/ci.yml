name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: dist/ is committed and up to date (installs from GitHub use it as-is)
        run: git diff --exit-code --stat -- dist

  examples:
    name: examples/${{ matrix.example }} (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { example: next-10, node: 14, page: /posts/1, src: 'pages/posts/\[id\].js' }
          - { example: next-11, node: 14, page: /posts/1, src: 'pages/posts/\[id\].js' }
          - { example: next-12, node: 16, page: /posts/1, src: 'pages/posts/\[id\].js' }
          - { example: next-13, node: 18, page: /, src: 'app/page.tsx' }
          - { example: next-14, node: 20, page: /, src: 'app/page.tsx' }
          - { example: next-15, node: 20, page: /, src: 'app/page.tsx' }
          - { example: next-16, node: 22, page: /, src: 'app/page.tsx' }
          - { example: next-16-pages, node: 22, page: /posts/1, src: 'pages/posts/\[id\].tsx' }
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # A tarball installs as a real copy on every npm version (npm 6 symlinks file: deps).
      - name: Pack the committed dist/
        working-directory: .
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install
        run: npm install --no-audit --no-fund --no-save "$(ls $RUNNER_TEMP/*.tgz)"
      - name: next dev serves pages with source locations
        run: |
          npx next dev -p 3000 > dev.log 2>&1 &
          for i in $(seq 1 90); do curl -sf localhost:3000/ -o /dev/null && break; sleep 2; done
          curl -sf "localhost:3000${{ matrix.page }}" -o page.html || (cat dev.log; exit 1)
          grep -q 'data-nd-src="${{ matrix.src }}' page.html || (cat dev.log; exit 1)
          curl -sf localhost:4590/ping
          if grep -E "ERR_REQUIRE_ESM|ModuleBuildError|Invalid next.config" dev.log; then exit 1; fi
          pkill -f "next dev" || true
      - name: next build has no DevTools code
        run: |
          npx next build
          if grep -rqE "data-nd-src|nd-panel|NEXT_DEVTOOLS_TOKEN" .next/static .next/server; then echo "DevTools leaked into production"; exit 1; fi
